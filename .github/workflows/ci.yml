name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.10"
  PYTHON_VERSION: "3.12"
  # The worked example, shared by several jobs. Kept here so a change to it is
  # one edit rather than five.
  SUITE: examples/support.yaml
  CASSETTE: examples/support-cassette.json
  JUDGE_CASSETTE: examples/support-judge-cassette.json
  BASELINE: examples/support-baseline.json

jobs:
  quality:
    name: Lint, format, types, docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --locked --group dev --group docs

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      - name: Build the documentation site
        # The builder fails on a broken internal link, so a renamed page fails
        # the pull request rather than shipping a 404.
        run: uv run --only-group docs python scripts/build_site.py --output _site

  test:
    name: Tests (${{ matrix.layer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every marker declared in pyproject.toml. A layer that exists and is
        # never selected is a layer nobody runs.
        layer: [unit, integration, security, e2e, meta]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --group dev

      - name: pytest -m ${{ matrix.layer }}
        run: uv run pytest -m ${{ matrix.layer }} -v

  coverage:
    name: Coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --group dev

      - name: Full suite with the coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

  gates:
    name: The tool gates its own example
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked

      - name: doctor
        run: uv run aievals doctor --suite "$SUITE"

      - name: The example cassettes still match the suite
        # Catches a suite edit that was never re-recorded, which would otherwise
        # surface as a cassette miss in somebody else's pull request.
        #
        # Not "regenerate and git diff": cassettes carry a `recorded_at`
        # timestamp, so that check would be red on every run forever. --check
        # compares the fingerprints and the answers, which is what a replay
        # reads, and writes nothing.
        run: uv run python scripts/build-example-cassette.py --check

      - name: gate --mutate
        run: |
          uv run aievals gate \
            --suite "$SUITE" --cassette "$CASSETTE" \
            --judge-cassette "$JUDGE_CASSETTE" --judge-model demo-judge \
            --baseline "$BASELINE" --mutate --min-caught 1.0 \
            --json-out reports/evals.json \
            --junit-out reports/evals.xml \
            --markdown-out reports/evals.md

      - name: The gate can still fail
        # A gate that only ever passes is indistinguishable from no gate. This
        # asserts the specific exit code, not merely non-zero: 2 is "a gate
        # failed" and 3 is "the harness could not run", and a job that cannot
        # tell them apart gets retried until it goes green.
        run: |
          set +e
          uv run aievals run --suite "$SUITE" --cassette "$CASSETTE" \
            --judge-cassette "$JUDGE_CASSETTE" --judge-model demo-judge \
            --min-pass-rate 1.1 >/dev/null 2>&1
          status=$?
          set -e
          [ "$status" -eq 2 ] || { echo "expected exit 2, got $status"; exit 1; }

      - name: Publish the summary
        if: always()
        run: cat reports/evals.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-reports
          path: reports/
          if-no-files-found: error

  examples:
    name: Examples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked

      - name: Run every example
        # They are documentation that executes. One that stops working is a
        # README that lies.
        run: |
          uv run python examples/quickstart.py
          uv run python examples/mutation_demo.py
          uv run python examples/statistics_demo.py

  build:
    name: Distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build the wheel and sdist
        run: uv build

      - name: The wheel installs and its console script works
        # Building is not the same as being installable. This catches a missing
        # package directory or a broken entry point, which a source checkout
        # never notices.
        run: |
          uv venv /tmp/verify
          VIRTUAL_ENV=/tmp/verify uv pip install dist/*.whl
          /tmp/verify/bin/aievals --version
          /tmp/verify/bin/aievals doctor

      - uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: dist/
          if-no-files-found: error
